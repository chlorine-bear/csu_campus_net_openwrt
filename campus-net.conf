# 中南大学校园网自动认证配置文件
# Dr.COM 门户 portal.csu.edu.cn
# 注意: 本文件包含账号密码，权限应设为 600

# 账号（学号）
USERNAME="--YOUR-STUDENT-ID--"  # example "87654321"

# 密码
PASSWORD="--YOUR-PASSWORD--"  # example "12345678"

# 运营商后缀（从门户登录页下拉框实际值抓取）
# 中国电信="@telecomn"  中国联通="@unicomn"  中国移动="@cmccn"  校园网=""（留空）
ISP_SUFFIX="--YOUR-ISP--"  # example "@unicomn"

# 备用后缀（校园网用户，无后缀）
ISP_SUFFIX_ALT=""

# WAN 接口（校园网接入网口）
WAN_IF="--WAN-ADAPTOR--"  # example "eth0"

# 连通性检测目标（ping 通视为已认证）
CHECK_IP="223.5.5.5"

# 认证服务器
PORTAL_HOST="portal.csu.edu.cn"
PORTAL_IP="10.1.1.1"
EPORTAL_URL="http://10.1.1.1:801/eportal/portal"
